services:
  mysql:
    image: mysql:8.0
    container_name: adivisor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-adivisor}
      MYSQL_USER: ${DB_USER:-adivisor}
      MYSQL_PASSWORD: ${DB_PASSWORD:-adivisor_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-adivisor}", "-p${DB_PASSWORD:-adivisor_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
    container_name: adivisor-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: ${PORT:-5000}
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-adivisor}
      DB_USER: ${DB_USER:-adivisor}
      DB_PASSWORD: ${DB_PASSWORD:-adivisor_password}
      JWT_SECRET: ${JWT_SECRET:-adivisor_dev_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PASSWORD_RESET_EXPIRES_IN: ${PASSWORD_RESET_EXPIRES_IN:-15m}
      PASSWORD_RESET_OTP_EXPIRES_IN: ${PASSWORD_RESET_OTP_EXPIRES_IN:-5m}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./Backend:/app
      - /app/node_modules
    command: sh -c "npm run db:init && npm run dev"

  backend-springboot:
    build:
      context: ./BackendSpringBoot
    container_name: adivisor-backend-springboot
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-adivisor}
      DB_USER: ${DB_USER:-adivisor}
      DB_PASSWORD: ${DB_PASSWORD:-adivisor_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-adivisor_dev_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GG_CLIENT_ID: ${GG_CLIENT_ID:-}
      GG_CLIENT_SECRET: ${GG_CLIENT_SECRET:-}
      GG_REDIRECT_URI: ${GG_REDIRECT_URI:-http://localhost:8080/api/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    container_name: adivisor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./Frontend
    container_name: adivisor-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - backend-springboot
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
      VITE_SPRING_BOOT_API_URL: ${VITE_SPRING_BOOT_API_URL:-http://localhost:8080/api}
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    command: npm run dev

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: adivisor-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"

volumes:
  mysql_data:
