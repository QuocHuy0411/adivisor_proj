
spring:
  config:
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:adivisor}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USER:adivisor}
    password: ${DB_PASSWORD:adivisor_password}
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

google:
  oauth:
    client-id: ${GG_CLIENT_ID:${GG_CLIENT-ID:}}
    client-secret: ${GG_CLIENT_SECRET:${GG_CLIENT-SECRET:}}
    redirect-url: ${GG_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}

server:
  port: 8080

jwt:
  signerKey: ${JWT_SECRET:adivisor_dev_secret_change_me}
  refreshSignerKey: ${JWT_REFRESH_SECRET:dev_refresh_secret_change_me}
  accessTokenExpiration: ${JWT_ACCESS_EXPIRES_SECONDS:28800}
  refreshTokenExpiration: ${JWT_REFRESH_EXPIRES_SECONDS:604800}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}
  smtp:
    from: ${SMTP_FROM:${SMTP_USER:}}
  otp:
    expires-in-seconds: ${OTP_EXPIRES_SECONDS:300}
  password-reset:
    expires-in-seconds: ${PASSWORD_RESET_EXPIRES_SECONDS:900}
